name: Generate GPT-SoVITS Korean teacher voice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dictation/tools/generate_gptsovits.py
      - .github/workflows/generate-gptsovits-voice.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: gptsovits-classroom-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Confirm all old voice files are unchanged
        run: |
          node scripts/dictation_voice_lock.cjs
          node scripts/dictation_voice_lock38.cjs
          node scripts/dictation_voice_s1.cjs
      - name: Install official GPT-SoVITS CPU inference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          git clone --depth 1 https://github.com/RVC-Boss/GPT-SoVITS.git _gptsovits
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          grep -Ev '^(torch==|torchaudio==|torchvision==|deepspeed==|onnxruntime-gpu|tensorrt|flash-attn|triton)' _gptsovits/requirements.txt > /tmp/gptsovits-cpu-requirements.txt
          python -m pip install -r /tmp/gptsovits-cpu-requirements.txt
          python -m pip install huggingface_hub soundfile resampy
      - name: Generate 172 actual GPT-SoVITS Korean utterances
        run: python -u dictation/tools/generate_gptsovits.py
      - name: Validate and activate completed voice
        run: |
          python dictation/tools/activate_new_voice.py GPTSOVITS
          node scripts/dictation_voice_lock.cjs
          node scripts/dictation_voice_lock38.cjs
          node scripts/dictation_voice_s1.cjs
          node scripts/dictation_smoke.cjs
      - name: Commit genuine MP3s and activate voice in website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dictation/voice/GPTSOVITS dictation/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish genuine GPT-SoVITS Korean teacher voice'
            # Other classroom updates may land during the long audio generation.
            # Rebase and retry a non-force push rather than overwriting changes.
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo 'GPT-SoVITS files published successfully.'
                break
              fi
              if [ "$attempt" -eq 8 ]; then
                echo 'Failed to publish after 8 non-force attempts.' >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
      - name: Request updated GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
