name: Generate Korean MeloTTS voice files
on:
  workflow_dispatch:
  push:
    paths:
      - 'dictation/tools/generate_melo.py'
      - '.github/workflows/generate-melo-voice.yml'
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install MeloTTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: Generate original 140 sentences and prompts
        run: python dictation/tools/generate_melo.py
      - name: Confirm 172 audio files before website activation
        run: |
          python dictation/tools/activate_new_voice.py MELO
          node scripts/dictation_voice_lock.cjs
          node scripts/dictation_voice_lock38.cjs
          node scripts/dictation_voice_s1.cjs
          node scripts/dictation_smoke.cjs
      - name: Commit actual MP3 files and updated voice selector only after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictation/voice/MELO/*.mp3 dictation/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified MeloTTS Korean voice with website selector"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
