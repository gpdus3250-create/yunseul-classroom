name: 윤슬초 1학년 주간학습안내 자동 확인
on:
  workflow_dispatch:
  schedule:
    # 00/06/12/18 UTC = 09/15/21/03 KST, best-effort (may be delayed).
    - cron: "0 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_weekly.py"
      - ".github/workflows/weekly-sync.yml"
permissions:
  contents: write
concurrency:
  group: yunseul-weekly-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public notice reader and Korean document converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Check public grade-1 weekly notices
        run: python scripts/sync_weekly.py
      - name: Save verified documents and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly notice status and publicly available documents"
            git push
          fi
