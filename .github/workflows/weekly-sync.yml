name: 윤슬초 1학년 주간학습안내 자동 확인
on:
  workflow_dispatch:
  schedule:
    # UTC 00,06,12,18 = KST 09,15,21,03; schedules may be delayed.
    - cron: "0 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_weekly.py"
      - "scripts/recommend_lessons.py"
      - "requirements.txt"
      - ".github/workflows/weekly-sync.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: yunseul-weekly-sync
  cancel-in-progress: false
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public notice reader and Korean document converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Check public grade-1 weekly notices
        run: python scripts/sync_weekly.py
      - name: Recommend activities based on original weekly PDFs
        run: python scripts/recommend_lessons.py
      - name: Save verified documents and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly notice status and publicly available documents"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed PDF previews
        id: deployment
        uses: actions/deploy-pages@v4
