name: Generate new classroom teacher voices (F2 M2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dictation/generate_teacher_voices.py
      - .github/workflows/generate-teacher-voices.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: dictation-teacher-voice-assets
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify original F1 and M1 cannot have changed
        run: node scripts/dictation_voice_lock.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Korean AI speech synthesis
        run: |
          python -m pip install --upgrade pip
          python -m pip install supertonic imageio-ffmpeg
      - name: Generate separate F2 and M2 voice clips
        run: python -u dictation/generate_teacher_voices.py
      - name: Validate both 38.0 teacher voice sets
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("dictation/voice")
          for voice in ("F2","M2"):
              files=list((root/voice).glob("*.mp3"))
              assert len(files)==172,(voice,len(files))
              assert all(f.stat().st_size>1200 for f in files),voice
              for grade in range(1,15):
                  assert sum(f.name.startswith(f"g{grade:02d}_") for f in files)==10,(voice,grade)
              print(voice,": validated",len(files),"natural speech recordings",flush=True)
          PY
          node scripts/dictation_voice_lock.cjs
      - name: Commit only new voice folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictation/voice/F2 dictation/voice/M2
          if git diff --cached --quiet; then
            echo "Teacher voices already generated"
          else
            git commit -m "Add separate 38.0 teacher-style Korean F2 and M2 recordings"
            git pull --rebase origin main
            node scripts/dictation_voice_lock.cjs
            git push origin HEAD:main
          fi
      - name: Request GitHub Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
