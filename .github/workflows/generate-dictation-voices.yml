name: Generate Dictation Kingdom natural voices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dictation/voice-manifest.json
      - dictation/generate_voices.py
      - .github/workflows/generate-dictation-voices.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: dictation-voice-assets
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install natural Korean TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install supertonic imageio-ffmpeg
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Generate female and male Korean narration
        run: python -u dictation/generate_voices.py
      - name: Verify generated audio files
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('dictation/voice')
          for voice in ('F1','M1'):
              files=list((root/voice).glob('*.mp3'))
              assert len(files)==172,(voice,len(files))
              assert all(f.stat().st_size>1000 for f in files)
              print(voice, len(files), 'validated audio files')
          PY
      - name: Verify both original AI voices remain unchanged
        run: node scripts/dictation_voice_lock.cjs
      - name: Commit recorded voices without changing classroom site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictation/voice
          if git diff --cached --quiet; then
            echo "Recorded voices unchanged"
          else
            git commit -m "Generate natural Korean dictation voice assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh public GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
