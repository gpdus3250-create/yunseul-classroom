/* 인천윤슬초등학교 공식 사이트 바로가기 */
.school-panel{margin-top:18px;padding:21px 23px;border:1px solid #e6defb;border-radius:21px;background:linear-gradient(140deg,#ffffff,#faf7ff);box-shadow:var(--shadow)}
.school-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.school-panel-head h2{font-size:18px;color:#6651a4}.school-panel-head p{font-size:12px;color:#807591;margin-top:2px}
.school-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.school-link{display:flex;gap:9px;align-items:center;justify-content:center;background:#f4efff;border:1px solid #e9ddff;border-radius:15px;text-decoration:none;color:#624a9a;font-weight:800;padding:15px 8px;min-height:59px;line-height:1.35;font-size:13px;text-align:center}
.school-link:hover,.school-link:focus-visible{background:#ebe1ff;border-color:#cab7fa;transform:translateY(-1px)}
.school-link span{font-size:22px}
.school-status{font-size:11px;color:#7f7492;margin-top:12px;line-height:1.6}
@media(max-width:850px){.school-links{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 공개 윤슬초 시트 바로가기 6개 + 개인용 브라우저 저장 링크 */
.personal-shortcut-card{display:flex;align-items:stretch;min-width:0}.personal-shortcut-card .school-link{text-align:left;justify-content:flex-start;min-height:66px}.personal-shortcut-card button.school-link{cursor:pointer;font:inherit}.personal-shortcut-card .school-link .sheet-label{flex:1}.personal-shortcut-card button.school-link:hover{background:#e9e1ff}

.personal-shortcut-panel{background:linear-gradient(140deg,#fff,#faf6ff);border-color:#dcd0fa}
.personal-shortcut-panel .school-panel-head h2{color:#6950a9}
.personal-shortcut-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.personal-shortcut-links .school-link{justify-content:flex-start;padding:13px 15px;min-width:0;overflow-wrap:anywhere;text-align:left}
.personal-shortcut-links .school-link .sheet-label{min-width:0;flex:1}
.personal-shortcut-remove{border:1px solid #e4dcf3;background:#fff;border-radius:10px;color:#7a6c93;padding:6px 8px;font-size:11px}
.personal-shortcut-remove:hover{background:#fff0f2;color:#c04c68}
.personal-shortcut-panel .school-status{margin-top:10px}
@media(max-width:850px){.personal-shortcut-links{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.personal-shortcut-links{grid-template-columns:1fr}}

/* 실제 주간학습안내 기반 수업 추천 */
.lesson-panel{margin-top:20px;padding:23px;border:1px solid #e4d8fa;border-radius:24px;background:linear-gradient(145deg,#fff,#fbf7ff);box-shadow:var(--shadow)}
.lesson-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lesson-panel-head h2{color:#674aa6;font-size:20px}
.lesson-panel-head p{font-size:12px;color:#817692;margin-top:4px}
.lesson-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lesson-card{padding:17px;border:1px solid #eae4f4;border-radius:18px;background:#fff;min-width:0}
.lesson-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.lesson-card-subject{font-size:11px;background:#f0eaff;color:#694ba5;border-radius:20px;padding:4px 9px;font-weight:800}
.lesson-card h3{color:#463569;font-size:16px;margin-bottom:7px}
.lesson-card p{font-size:12px;color:#6f6880;line-height:1.6}
.lesson-evidence{font-size:11px;background:#f8f5ff;color:#695784;padding:9px 10px;border-radius:11px;margin:11px 0;line-height:1.55}
.lesson-buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.lesson-buttons button{font-size:12px;font-weight:800;background:#8267d2;color:#fff;border:0;border-radius:12px;padding:10px 12px}
.lesson-buttons button:hover{background:#6c50c1}
.lesson-status{padding:20px;color:#716586;font-size:13px;background:#f8f5ff;border-radius:13px}
.lesson-disclaimer{margin-top:11px;font-size:11px;color:#867894;line-height:1.6}
.meaning-panel{margin-top:20px;border:1px solid #dfd3f7;border-radius:18px;padding:20px;background:#faf6ff}
.meaning-panel h3{color:#6147a3;margin-bottom:8px}
.meaning-story{font-size:17px;line-height:1.8;background:white;padding:17px;border-radius:13px;margin:14px 0;white-space:pre-wrap}
.meaning-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.meaning-choices button{background:white;border:1px solid #dcd1f4;border-radius:12px;padding:14px 7px;font-weight:700;color:#5e4d80}
.meaning-choices button:disabled{opacity:.7}
@media(max-width:720px){.lesson-cards{grid-template-columns:1fr}.meaning-choices{grid-template-columns:1fr}.lesson-panel{padding:17px}}



/* 상상·이야기 게임랜드: 선생님 설명 대신 클릭 즉시 게임 */
.quick-play{margin:20px 0;border:1px solid #dfd3f7;border-radius:24px;background:linear-gradient(125deg,#fbf8ff,#fff8e8);padding:22px 23px;box-shadow:var(--shadow)}
.quick-play h2{font-size:20px;color:#6750a2;letter-spacing:-.7px}
.quick-play p{font-size:12px;color:#87769c;margin:4px 0 17px}
.quick-play-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-play-card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px;border:1px solid #e8dff7;background:white;border-radius:17px;text-decoration:none;color:#6b539c;transition:transform .15s}
.quick-play-card:hover{transform:translateY(-2px);background:#f8f3ff;border-color:#cebff4}
.quick-play-card .game-icon{font-size:30px}
.quick-play-card strong{font-size:14px;color:#5c448b}
.quick-play-card small{font-size:11px;line-height:1.4;color:#9583a6}
.lesson-upgraded .lesson-buttons a.play-now{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#7550c6;border:0;border-radius:12px;padding:11px 13px;color:white;font-size:13px;font-weight:900}
.lesson-upgraded .lesson-buttons a.play-now:hover{background:#6240b6}
@media(max-width:850px){.quick-play-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){.quick-play-grid{grid-template-columns:1fr}}

/* 1학년 수업 아이디어 연구소 - 노란/보라 산뜻한 카드와 교과별 탭 */
.lesson-upgraded{background:linear-gradient(145deg,#fff,#faf7ff 70%,#f4fcfa);padding:26px;border-radius:25px}
.lesson-upgraded .lesson-panel-head{margin-bottom:20px}
.lesson-upgraded .lesson-panel-head h2{font-size:21px}
.lesson-toolbar{margin:5px 0 18px}
.lesson-counts{font-size:12px;color:#827394;margin-bottom:13px}
.lesson-counts strong{font-size:16px;color:#7959c3}
.lesson-filters{display:flex;gap:8px;overflow:auto;padding:2px 0 9px;scrollbar-width:thin}
.lesson-filter{flex-shrink:0;display:flex;align-items:center;gap:6px;border:1px solid #e4daf7;border-radius:13px;background:#fff;color:#76648e;padding:10px 13px;font-weight:800;font-size:12px}
.lesson-filter.on{background:#7e65cd;color:#fff;border-color:#7e65cd;box-shadow:0 5px 13px #7e65cd33}
.lesson-filter b{opacity:.85;font-size:11px}
.lesson-card-upgraded{border:1px solid #eae2fa;box-shadow:0 4px 16px #8d6bbc0e;padding:19px}
.lesson-card-upgraded h3{font-size:17px;color:#513777}
.lesson-card-icon{font-size:27px}
.lesson-card-time{font-size:11px;color:#887a9b;background:#faf5ff;border-radius:11px;padding:5px 9px;margin-left:auto;white-space:nowrap}
.lesson-card-topic{font-size:11px;color:#887a9b;margin-bottom:10px}
.lesson-card-hook{font-size:13px!important;color:#4e4262!important;font-weight:700;line-height:1.65}

function documentShell(title,body){return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${safe(title)}</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:12pt;color:#242132;margin:0}h1{font-size:21pt;text-align:center;margin:0 0 18px}h2{font-size:15pt;margin:14px 0}.meta{display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding-bottom:10px;margin-bottom:20px}.questions{padding-left:27px}.questions li{min-height:34px;padding:8px 0;border-bottom:1px dotted #d8d8d8;line-height:1.8;break-inside:avoid}.answer-space{border-bottom:1px solid #bbb;display:inline-block;width:130px;margin-left:12px}.pagebreak{page-break-before:always}.coupon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9mm 4mm}.coupon{height:45mm;border:2px dashed #a993d7;border-radius:12px;text-align:center;padding:9mm 1mm;break-inside:avoid;background:#faf7ff}.coupon strong{display:block;font-size:14pt;color:#7054b3}.coupon span{display:block;font-size:22pt}.certificate{border:9px double #bdabe8;padding:32mm 12mm;text-align:center;min-height:248mm}.certificate h1{font-size:27pt;color:#7959bc}.certificate p{line-height:2.2;font-size:17pt}.hand-grid{display:grid;grid-template-columns:repeat(12,1fr);margin-top:10mm;border-top:1px solid #999;border-left:1px solid #999}.hand-grid i{height:11mm;border-bottom:1px solid #bbb;border-right:1px solid #bbb}.hand-grid i:first-child{background:#f3f0ff}.line{border-bottom:1px solid #c8c2d1;height:12mm}.box{border:1px solid #bbb;border-radius:12px;padding:15px;margin:12px 0}.tag{color:#7957b7} @media print{button{display:none}}</style></head><body>${body}</body></html>`}
function printHTML(title,body){const w=window.open('','_blank');if(!w){toast('팝업이 차단됐어요. 브라우저에서 팝업을 허용해 주세요.');return false}w.document.open();w.document.write(documentShell(title,body));w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch(e){console.warn(e)}},450);return true}
function download(name,data,mime='text/plain'){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvEscape(value){let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function attr(name){return $(`[name="${name}"]`)?.value??''}
function speak(text){if(!('speechSynthesis' in window)){toast('이 브라우저에서는 음성 읽기를 지원하지 않아요.');return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.85;u.pitch=1.03;const v=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ko'));if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){toast('음성을 재생하지 못했어요. 브라우저 설정을 확인해 주세요.')}}

const PERSONAL_LINKS_KEY='yunseul_personal_sheet_shortcuts_v1';
function personalSafeUrl(url){
 try{
  const u=new URL(String(url||''));
  return u.protocol==='https:'&&u.hostname==='docs.google.com'&&/^\/spreadsheets\/d\/[a-zA-Z0-9_-]+(?:\/|$)/.test(u.pathname)?u.href:null;
 }catch(e){return null}
}
function personalEscape(value){
 return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function personalGetLinks(){
 try{
  const items=JSON.parse(localStorage.getItem(PERSONAL_LINKS_KEY)||'[]');
  if(!Array.isArray(items))return [];
  return items.filter(x=>x&&personalSafeUrl(x.url)&&typeof x.title==='string').slice(0,24)
    .map(x=>({title:x.title.slice(0,70),url:personalSafeUrl(x.url)}));
 }catch(e){return []}
}
function personalImportFromHash(){
 const marker=new URLSearchParams(location.hash.slice(1)).get('add-shortcuts');
 if(!marker)return false;
 try{
  const items=JSON.parse(marker);
  if(!Array.isArray(items)||items.length>24||items.length===0)throw Error('잘못된 링크 목록');
  const incoming=items.map(x=>({title:String(x.title||'').slice(0,70),url:personalSafeUrl(x.url)}));
  if(incoming.some(x=>!x.title||!x.url))throw Error('잘못된 스프레드시트 주소');
  const merged=new Map(personalGetLinks().map(x=>[x.url,x]));
  for(const item of incoming)merged.set(item.url,item);
  localStorage.setItem(PERSONAL_LINKS_KEY,JSON.stringify([...merged.values()].slice(0,24)));
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  return true;
 }catch(e){console.warn('개인 바로가기 가져오기 실패',e);return false}
}

// 실제 학교 PDF의 확인 가능한 표현만 연결합니다. 불확실하면 추천을 보여주지 않습니다.
const lessonState={status:'loading',weeks:{},generated:null,message:'',filter:'all',expanded:false};
async function lessonsLoad(){
 if(location.protocol==='file:'){lessonState.status='unavailable';return;}
 try{
  const res=await fetch('./weekly-data/lesson-recommendations.json?ts='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const body=await res.json();
  if(body.version!==1||!body.weeks||typeof body.weeks!=='object')throw Error('추천 데이터 형식 확인 필요');
  lessonState.weeks=body.weeks;
  lessonState.generated=body.generated_at||null;
  lessonState.status='ok';
  lessonState.message='';
 }catch(e){
  lessonState.status='error';
  lessonState.message='학교 PDF 추천 데이터를 읽지 못했습니다.';
  console.warn(e);
 }
 if(ui.view==='home'||ui.view==='weekly')render();
}

// === 1학년 주간학습안내 미리보기 =============================
// 주간 자동 업데이트: 배포된 호스트가 정기 생성한 weekly-data/index.json을 이 페이지에서 표시함.
// 학교 게시판에 실시간으로 직접 접근할 수 없는 경우에도 이전 검증 자료를 유지하며 상태를 명확히 표시함.
const WEEKLY_BOARD='https://yunseul.icees.kr/boardCnts/list.do?boardID=317890&m=020901&s=yunseul';
const weeklyState={selectedWeek:'',entries:new Map(),urls:new Map(),remote:new Map(),remoteStatus:'loading',remoteChecked:null,remoteMessage:'',ready:false,persistent:true};
function weeklyISO(d){return d.toISOString().slice(0,10)}
function weeklyWeek(d=new Date()){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
 const obj=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 const day=new Date(`${obj.year}-${obj.month}-${obj.day}T00:00:00Z`);
 day.setUTCDate(day.getUTCDate()-(day.getUTCDay()+6)%7);
 return weeklyISO(day);
}
function weeklyOffset(iso,n){const d=new Date(`${iso}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+n);return weeklyISO(d)}
function weeklyLabel(iso){return `${iso.replace(/-/g,'.')} (월) ~ ${weeklyOffset(iso,4).replace(/-/g,'.')} (금)`}
function weeklySelected(homeMode){return homeMode?weeklyWeek():weeklyState.selectedWeek||weeklyWeek()}
function weeklyStored(week){return weeklyState.remote.get(week)||weeklyState.entries.get(week)}
function weeklyFileURL(record){if(!record)return '';
 if(record.kind==='remote')return record.url;
 if(record.kind==='link')return record.url;
 if(!record.blob)return '';
 if(!weeklyState.urls.has(record.week))weeklyState.urls.set(record.week,URL.createObjectURL(record.blob));
 return weeklyState.urls.get(record.week);
}
function weeklyDestroyURL(week){const url=weeklyState.urls.get(week);if(url){URL.revokeObjectURL(url);weeklyState.urls.delete(week)}}
function weeklyPreview(record,homeMode){const url=weeklyFileURL(record);if(!url)return '';
 const img=record.kind==='image'||(record.kind==='remote'&&record.preview_type==='image')||(record.kind==='link'&&/\.(?:jpe?g|png|webp)(?:[?#]|$)/i.test(url));
 const name=safe(record.name||'이번 주 학습안내');
 if(img)return `<div class="weekly-preview ${homeMode?'weekly-preview-home':''}"><img src="${safe(url)}" alt="${name} 미리보기" loading="lazy"></div>`;
 if(record.kind==='link' && url.includes('drive.google.com/file/d/'))return `<div class="weekly-preview ${homeMode?'weekly-preview-home':''}"><iframe src="${safe(url)}" title="${name}" loading="lazy" referrerpolicy="no-referrer"></iframe></div>`;
 return `<div class="weekly-preview ${homeMode?'weekly-preview-home':''}"><object data="${safe(url)}#toolbar=1" type="application/pdf" aria-label="${name}"><div class="weekly-drop"><strong>브라우저에서 PDF를 표시하지 못했어요.</strong><p>원본 열기 버튼으로 확인할 수 있어요.</p></div></object></div>`;
}
function weeklyFileArea(week){return `<div class="weekly-drop" id="weekly-dropzone"><div style="font-size:36px;margin-bottom:5px">📅 🌷 ✨</div><strong>아직 이번 주 학교 자료가 확인되지 않았어요.</strong><p>학교에 새로운 주간학습안내가 게시되고 자동 수집·변환이 완료되면<br>이 자리에 PDF 또는 이미지가 자동으로 나타나요.</p><p class="weekly-tips">자동 갱신 상태는 바로 아래에서 확인할 수 있어요.</p></div>`;}
function weeklyFileBar(record,week){const url=weeklyFileURL(record);const fileHref=url;
 if(record.kind==='remote'){const src=record.source_url?`<a href="${safe(record.source_url)}" target="_blank" rel="noopener noreferrer">🏫 원본 게시글</a>`:'';return `<div class="weekly-filebar"><div>🏫 <b>${safe(record.title||'학교 주간학습안내')}</b><small>${safe(weeklyLabel(week))} · 공식 학교 게시판에서 자동으로 가져온 자료</small></div><div class="weekly-file-actions"><a href="${safe(url)}" target="_blank" rel="noopener noreferrer">🔍 크게 보기</a>${src}</div></div>`;}
 return `<div class="weekly-filebar"><div>📎 <b>${safe(record.name||'학습안내')}</b><small>${safe(weeklyLabel(week))} · ${record.kind==='link'?'연결된 온라인 자료':'이 브라우저에 저장됨'}</small></div><div class="weekly-file-actions"><a href="${safe(fileHref)}" target="_blank" rel="noopener noreferrer">🔍 크게 보기</a><label for="weekly-file" class="weekly-upload" style="font-size:12px;padding:8px 12px;min-height:36px">🔄 교체<input id="weekly-file" aria-label="학습안내 파일 교체" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp"></label><button data-act="weekly-delete">삭제</button></div></div>`}
function weeklyPanel(homeMode=false){const week=weeklySelected(homeMode),rec=weeklyStored(week),loading=!weeklyState.ready;
 let body=`<section class="weekly-panel" aria-label="이번 주 주간학습안내 미리보기"><div class="weekly-head"><div><div class="weekly-title">📅 ${homeMode?'이번 주':'1학년'} 주간학습안내 <span style="font-size:13px">✨</span></div><div class="weekly-sub">인천윤슬초등학교 · ${safe(db.settings.grade)}학년 ${safe(db.settings.room)}반</div></div><div class="weekly-top-actions"><span class="weekly-tag">🔄 학교 게시판 자동 연동</span>${homeMode?'<button class="weekly-view-more" data-view="weekly">🗂️ 지난 주 자료도 보기 ↗</button>':''}</div></div>`;
 if(!homeMode){body+=`<div class="weekly-control"><button data-act="weekly-prev" title="지난 주">← 지난 주</button><span class="weekly-date">${weeklyLabel(week)}</span><button data-act="weekly-next" title="다음 주">다음 주 →</button><button data-act="weekly-today">이번 주</button><input id="weekly-date-picker" aria-label="확인할 주의 날짜" type="date" value="${week}"></div>`;
  const all=[...new Set([...weeklyState.entries.keys(),...weeklyState.remote.keys()])].sort().reverse();if(all.length)body+=`<div class="weekly-savedweeks">${all.map(w=>`<button class="${w===week?'on':''}" data-act="weekly-pick" data-id="${w}">${safe(w.slice(5).replace('-','/'))} 주간</button>`).join('')}</div>`;
 }else body+=`<p class="weekly-date" style="margin:5px 0 12px">${weeklyLabel(week)}</p>`;
 if(loading)body+='<div class="weekly-drop"><strong>주간학습안내를 확인하고 있어요…</strong></div>';
 else if(rec&&rec.kind==='remote'&&rec.url)body+=weeklyFileBar(rec,week)+weeklyPreview(rec,homeMode);
 else if(rec&&rec.kind==='remote')body+=`<div class="weekly-drop"><strong>학교 게시글은 찾았지만 미리보기 변환은 실패했어요.</strong><p>${safe(rec.note||'파일 형식이 지원되지 않아요.')}</p><a href="${safe(rec.source_url)}" target="_blank" rel="noopener noreferrer">학교 게시글에서 원본 확인 ↗</a></div>`;
 else if(!rec)body+=weeklyFileArea(week);
 else body+=weeklyFileBar(rec,week)+weeklyPreview(rec,homeMode);
 
 body+=`<div class="weekly-foot">${weeklySyncStatus()} <a href="${WEEKLY_BOARD.replaceAll('&','&amp;')}" target="_blank" rel="noopener noreferrer" style="color:#7653b7;font-weight:800;margin-left:4px">공식 게시판 확인 ↗</a></div>`;
 return body+'</section>';
}
function weeklySyncStatus(){
 const t=weeklyState.remoteChecked?` · 마지막 확인: ${safe(new Date(weeklyState.remoteChecked).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))}`:'';
 if(weeklyState.remoteStatus==='ok')return `🟢 공식 학교 게시판 자동 확인 작동 중${t}. 새로운 글이 올라오면 정기 갱신 후 표시돼요.`;
 if(weeklyState.remoteStatus==='error')return `🟠 마지막 자동 확인 실패${t}. 이전에 확인한 자료는 유지되지만 새 자료 갱신은 지연될 수 있어요. ${safe(weeklyState.remoteMessage)}`;
 if(weeklyState.remoteStatus==='loading')return '🔄 자동 학습안내를 확인하는 중이에요.';
 return '⚪ 자동 연동을 실행하려면 이 사이트를 자동 갱신 서버에 게시해야 해요. HTML 파일만 열면 학교 서버의 자료를 직접 수집할 수 없습니다.';
}
async function weeklyRefreshRemote(){
 // This JSON is generated automatically on the server by a scheduled job. It cannot exist
 // in a standalone file:// HTML without a separately deployed scheduled service.
 if(location.protocol==='file:'){weeklyState.remoteStatus='not_connected';weeklyState.remoteMessage='';return;}
 try{
   const res=await fetch('./weekly-data/index.json?ts='+Date.now(),{cache:'no-store'});
   if(!res.ok)throw Error('자동 자료 API HTTP '+res.status);
   const data=await res.json();
   if(!data||!Array.isArray(data.items))throw Error('자료 형식이 잘못되었습니다.');
   const remote=new Map();
   for(const item of data.items){
     if(!/^\d{4}-\d{2}-\d{2}$/.test(item.week||''))continue;
     const source=new URL(item.source_url||WEEKLY_BOARD,location.href);
     if(source.hostname!=='yunseul.icees.kr')continue;
     let preview='';
     if(item.preview_url){
       const u=new URL(item.preview_url,location.href);
       if(u.origin!==location.origin)continue;
       preview=u.href;
     }
     remote.set(item.week,{kind:'remote',week:item.week,title:item.title||'공식 주간학습안내',name:item.filename||item.title,url:preview,preview_type:item.preview_type,source_url:source.href,note:item.note});
   }
   weeklyState.remote=remote;
   weeklyState.remoteStatus=data.status||'not_connected';
   weeklyState.remoteChecked=data.checked_at||null;
   weeklyState.remoteMessage=data.message||'';
 }catch(e){weeklyState.remoteStatus='error';weeklyState.remoteMessage=String(e.message||e);}
 if(weeklyState.ready)render();
}
function renderWeekly(){return heading('📅','주간학습안내','이번 주 자료를 이 사이트 안에서 크게 보고, 지난 주 자료도 다시 열어요.')+weeklyPanel(false)}
function weeklyDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));
 const req=indexedDB.open('yunseul-weekly-docs',1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('weeks'))req.result.createObjectStore('weeks',{keyPath:'week'})};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('DB open error'));
 })}
async function weeklyAll(){const dbi=await weeklyDB();return new Promise((resolve,reject)=>{const tx=dbi.transaction('weeks','readonly');const req=tx.objectStore('weeks').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>dbi.close();tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function weeklyPut(rec){const dbi=await weeklyDB();return new Promise((resolve,reject)=>{const tx=dbi.transaction('weeks','readwrite');tx.objectStore('weeks').put(rec);tx.oncomplete=()=>{dbi.close();resolve()};tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function weeklyClearAll(){const dbi=await weeklyDB();return new Promise((resolve,reject)=>{const tx=dbi.transaction('weeks','readwrite');tx.objectStore('weeks').clear();tx.oncomplete=()=>{dbi.close();resolve()};tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function weeklyDelete(w){const dbi=await weeklyDB();return new Promise((resolve,reject)=>{const tx=dbi.transaction('weeks','readwrite');tx.objectStore('weeks').delete(w);tx.oncomplete=()=>{dbi.close();resolve()};tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function weeklyLoad(){weeklyState.selectedWeek=weeklyWeek();try{for(const r of await weeklyAll())weeklyState.entries.set(r.week,r)}catch(e){console.warn('IndexedDB 저장 기능을 사용할 수 없습니다.',e);weeklyState.persistent=false}weeklyState.ready=true;render()}
async function weeklyHandleFile(file){if(!file)return;const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf',isImg=/\.(png|jpe?g|webp)$/i.test(file.name)||/^image\/(jpeg|png|webp)$/.test(file.type);
 if(!isPdf&&!isImg){toast('PDF 또는 PNG·JPG·WebP 파일만 미리 볼 수 있어요.');return}
 if(file.size>30*1024*1024){toast('파일은 30MB 이하로 넣어 주세요.');return}
 const week=weeklySelected(ui.view==='home');const record={week,kind:isPdf?'pdf':'image',name:file.name,blob:file,savedAt:new Date().toISOString()};
 try{await weeklyPut(record)}catch(err){console.warn(err);weeklyState.persistent=false;toast('현재 브라우저에 영구 저장할 수 없어 이번 실행에서만 볼 수 있어요.')}
 weeklyDestroyURL(week);weeklyState.entries.set(week,record);render();if(weeklyState.persistent)toast('이 주의 주간학습안내를 저장했어요! 💜');
}
async function weeklySaveLink(){let url=attr('weekly-url').trim();if(!url)return toast('온라인 PDF나 이미지의 주소를 붙여 넣어 주세요.');
 try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error('bad protocol');
 const d=url.match(/^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)(?:\/|\?|$)/);if(d)url=`https://drive.google.com/file/d/${d[1]}/preview`;

const KOREAN_ITEMS=[['나는 오늘 학교에 갔어요.','나는 오늘학교에 갔어요.'],['친구와 함께 놀았어요.','친구와함께 놀았어요.'],['할머니 댁에 다녀왔어요.','할머니댁에 다녀왔어요.'],['우리 집에 고양이가 있어요.','우리집에 고양이가 있어요.'],['책을 한 권 읽었어요.','책을 한권 읽었어요.'],['아침에 밥을 먹었어요.','아침에 밥을먹었어요.'],['나무 아래에 앉았어요.','나무아래에 앉았어요.'],['비가 와서 우산을 썼어요.','비가와서 우산을 썼어요.'],['동생이 그림을 그려요.','동생이 그림을그려요.'],['우리는 줄을 서요.','우리는 줄을서요.'],['노란 꽃이 피었어요.','노란꽃이 피었어요.'],['연필 세 자루가 있어요.','연필 세자루가 있어요.']];
const WRITE_TOPICS=['나를 웃게 한 일','학교에서 가장 재미있었던 시간','내가 만든 상상 속 동물','친구에게 고마웠던 일','비 오는 날 하고 싶은 일','내가 좋아하는 놀이','가장 기억에 남는 하루','우리 교실에 마법의 문이 생긴다면','오늘 내가 발견한 작은 것','내가 미래에 가 보고 싶은 곳'];
function makeQuestions(kind,n,difficulty){let items=[];let max=difficulty==='easy'?10:20;for(let i=0;i<n;i++){if(kind==='math'){const op=(i%3===2)?'-':'+';let a,b,answer;if(op==='+'){a=rnd(1,max-2);b=rnd(1,max-a);answer=a+b}else{a=rnd(2,max);b=rnd(1,a);answer=a-b}if(difficulty==='hard'&&i%4===3){const stories=[`사과가 ${a}개 있고, ${b}개를 더 받았어요. 모두 몇 개일까요?`,`연필이 ${a}자루 있어요. ${Math.min(b,a)}자루를 주면 몇 자루 남을까요?`];items.push({text:op==='+'?stories[0]:stories[1],answer:String(answer)})}else items.push({text:`${a} ${op} ${b} =`,answer:String(answer)})}
else if(kind==='pattern'){let seed=rnd(1,6),step=rnd(1,difficulty==='hard'?4:2),sequence=Array.from({length:5},(_,j)=>seed+j*step);let missing=rnd(1,4);let correct=sequence[missing];sequence[missing]='□';items.push({text:`규칙을 찾아 빈칸에 알맞은 수를 쓰세요.  ${sequence.join('  →  ')}`,answer:String(correct)})}
else if(kind==='korean'){const [correct,wrong]=KOREAN_ITEMS[i%KOREAN_ITEMS.length];const flip=Math.random()>.5;const opts=flip?[wrong,correct]:[correct,wrong];items.push({text:`바르게 띄어 쓴 문장에 ○표 하세요.\n  ① ${opts[0]}\n  ② ${opts[1]}`,answer:flip?'②':'①'})}
else {items.push({text:`${WRITE_TOPICS[i%WRITE_TOPICS.length]}에 대해 두세 문장으로 써 보세요.`,answer:'자유 응답'})}}return items}

function mathProblem(category){let type=category==='mixed'?pick(['sum','sub','pattern','compare']):category;
if(type==='sum'){const a=rnd(1,12),b=rnd(1,20-a);return {q:`${a} + ${b} = ?`,answer:a+b,explain:`${a}에 ${b}를 더하면 ${a+b}이에요.`}}
if(type==='sub'){const a=rnd(5,20),b=rnd(1,a);return {q:`${a} - ${b} = ?`,answer:a-b,explain:`${a}에서 ${b}를 빼면 ${a-b}이에요.`}}
if(type==='pattern'){const a=rnd(1,8),d=rnd(1,3);return {q:`${a} → ${a+d} → ${a+d*2} → ?`,answer:a+d*3,explain:`${d}씩 커지는 규칙이에요.`}}
const a=rnd(1,20),b=rnd(1,20);return {q:`${a}와 ${b} 중 더 큰 수는?`,answer:Math.max(a,b),explain:`${a}와 ${b}를 비교하면 ${Math.max(a,b)}이 더 크거나 같아요.`}}
function nextMath(){ui.math.problem=mathProblem(ui.math.category);ui.math.result=null;ui.math.hint=false}
function mathOptions(){const answer=ui.math.problem.answer;const n=[answer];for(let d=1;n.length<3;d++){if(answer+d<=30)n.push(answer+d);if(n.length<3&&answer-d>=0)n.push(answer-d)}return shuffle(n)}
function renderMath(){const m=ui.math;if(!m.problem)nextMath();if(!m.options||!m.options.includes(m.problem.answer))m.options=mathOptions();return heading('🔎','수학 탐정 사무소','수수께끼를 풀며 수학 탐정이 되어 보세요!')+shell('사건 종류 선택',`<div class="btn-group">${[['mixed','🎲 골고루'],['sum','➕ 덧셈'],['sub','➖ 뺄셈'],['pattern','🔺 규칙'],['compare','⚖️ 수 비교']].map(([k,v])=>`<button class="btn ${m.category===k?'':'outline'}" data-act="math-category" data-id="${k}">${v}</button>`).join('')}</div>`)+`<div class="panel soft"><div class="quiz-header"><span class="tag">탐정 미션 ${m.count+1}</span><span class="badge-num">🕵️ 해결한 사건 ${m.score}개</span></div><div class="big-question">${safe(m.problem.q)}</div><div class="option-grid">${m.options.map(n=>`<button class="option" data-act="math-answer" data-id="${n}" ${m.result?'disabled':''}>${n}</button>`).join('')}</div>${m.result?`<div class="result ${m.result.ok?'':'bad'}">${m.result.ok?'사건 해결! ✨':'괜찮아요, 다음 사건에서 도전!'} ${safe(m.problem.explain)}</div>`:''}<div class="btn-group" style="margin-top:14px"><button class="btn light" data-act="math-hint">💡 힌트</button><button class="btn" data-act="math-next">다음 사건 →</button></div>${m.hint?`<div class="notice">💡 ${m.problem.q.includes('→')?'앞의 수가 얼마나 커지는지 살펴보세요.':m.problem.q.includes('중')?'어느 쪽이 수직선에서 더 오른쪽에 있을까요?':'손가락이나 수 모형을 이용해 차근차근 세어 보세요.'}</div>`:''}</div>`}

function mediaTemplate(story,mode){const s=story.trim()||'(여기에 우리 이야기를 써 보세요.)';const templates={news:`[우리 반 뉴스 방송국]\n\n안녕하십니까. ${db.settings.school||'우리 학교'} 방송국 어린이 앵커입니다.\n\n오늘의 소식을 전해 드리겠습니다.\n${s}\n\n현장에는 어떤 일이 있었는지 더 자세히 알아보겠습니다.\n\n지금까지 우리 반 뉴스였습니다. 감사합니다.`,radio:`[소리로 만나는 우리 이야기]\n\n(오프닝 효과음: 딩동♪)\n여러분, 안녕하세요! 오늘은 특별한 이야기를 들려 드릴게요.\n\n${s}\n\n(배경 소리를 넣어 볼까요?)\n이 이야기를 듣고 여러분은 어떤 생각이 드셨나요?\n\n(클로징 음악) 다음에 또 만나요!`,comic:`[4컷 만화 대본]\n\n① 첫 장면: 장소와 등장인물을 그려요.\n   글/말풍선: ${s}\n\n② 두 번째 장면: 어떤 일이 일어났나요?\n   글/말풍선: __________________\n\n③ 세 번째 장면: 등장인물은 어떻게 느꼈나요?\n   글/말풍선: __________________\n\n④ 마지막 장면: 어떤 결말이 나올까요?\n   글/말풍선: __________________`,poster:`[한눈에 보는 알림 포스터]\n\n큰 제목: ____________________\n\n가장 중요한 소식:\n${s}\n\n보여 주고 싶은 그림: __________________\n\n친구에게 전하고 싶은 한마디: __________\n\n(그림 / 사진 / 글 중 가장 잘 어울리는 것을 골라요.)`};return templates[mode]||templates.news}

const metricVal=(record,phase,key)=>record[phase]?.[key]??'';

 data-act="fitness-delete" data-id="${r.id}">삭제</button></div></td></tr>`).join(''):'<tr><td colspan="8" style="text-align:center;padding:30px">아직 기록이 없어요. 첫 학생을 추가해 주세요.</td></tr>'}</tbody></table></div><p class="small-hint">변화는 재측정 − 첫 측정입니다. 수치가 커졌다고 모든 종목에서 무조건 더 좋다는 뜻은 아니며, 지도 목적에 맞게 해석해 주세요.</p>`)}

let speedTimer=null,mediaRecorder=null,mediaStream=null,mediaChunks=[];
async function startMediaRecording(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('마이크 녹음을 지원하지 않는 환경이에요. HTTPS 또는 PC 브라우저를 확인해 주세요.');return}
 try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(mediaStream);mediaChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data?.size)mediaChunks.push(e.data)};mediaRecorder.onstop=()=>{if(mediaChunks.length)download('매체변신_나의목소리_'+dateToday()+'.webm',new Blob(mediaChunks,{type:mediaRecorder.mimeType||'audio/webm'}),'audio/webm');mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;ui.media.recording=false;if(ui.view==='media')render();toast('녹음 파일을 저장했어요.')};mediaRecorder.start();ui.media.recording=true;render();toast('녹음이 시작됐어요. 마이크를 향해 말해 보세요.')}
 catch(err){console.warn(err);mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;toast('마이크 접근을 허용해 주세요. 브라우저 권한을 확인해 주세요.')}
}

case'media-mode':ui.media.story=attr('media-story');ui.media.draft=attr('media-draft');ui.media.mode=id;render();break;
case'media-generate':ui.media.story=attr('media-story');ui.media.draft=mediaTemplate(ui.media.story,ui.media.mode);render();toast('매체별 표현 틀을 만들었어요.');break;
case'media-print':{const doc=attr('media-draft').trim();if(!doc)return toast('작품 내용을 먼저 적어 주세요.');printHTML('매체 변신 연구소',`<h1>🎤 매체 변신 연구소</h1><div class="meta"><span>${safe(db.settings.grade)}학년 ${safe(db.settings.room)}반</span><span>번호 (　　) 이름 (　　　　　　　)</span></div><div style="white-space:pre-wrap;line-height:2.1;font-size:13pt">${safe(doc)}</div>`);break}
case'media-save':{const draft=attr('media-draft').trim();if(!draft)return toast('저장할 작품 내용을 적어 주세요.');ui.media.story=attr('media-story');ui.media.draft=draft;db.mediaDocs.unshift({id:eid(),name:(ui.media.story||draft).slice(0,28),type:ui.media.mode,date:dateToday(),story:ui.media.story,draft});save();render();toast('작품을 저장했어요!');break}
case'media-read':speak(attr('media-draft'));break;
case'media-record':startMediaRecording();break;
case'media-stop':if(mediaRecorder?.state==='recording')mediaRecorder.stop();break;
case'media-load':{const doc=db.mediaDocs.find(d=>d.id===id);if(doc){ui.media.mode=doc.type;ui.media.story=doc.story;ui.media.draft=doc.draft;render();toast('저장한 작품을 열었어요.')}break}
case'media-delete':db.mediaDocs=db.mediaDocs.filter(d=>d.id!==id);save();render();break;
case'fitness-save':{const name=attr('fit-name').trim();if(!name)return toast('학생 이름이나 번호를 입력해 주세요.');const grade=Number(attr('fit-grade')),room=Number(attr('fit-room'));if(!(grade>=1&&grade<=6&&room>=1&&room<=30))return toast('학년과 반을 확인해 주세요.');const v={id:ui.fitnessEdit?.id||eid(),name,grade,room,star:$('[name="fit-star"]').checked,before:{},after:{}};for(const phase of ['before','after'])for(const [key] of MEASURES){const txt=attr(`${phase}-${key}`);v[phase][key]=txt===''?'':Number(txt);if(txt!==''&&!Number.isFinite(v[phase][key]))return toast('측정 기록은 숫자로 입력해 주세요.')}if(ui.fitnessEdit)db.fitness=db.fitness.map(x=>x.id===v.id?v:x);else db.fitness.push(v);ui.fitnessEdit=null;save();render();toast('측정 기록을 저장했어요.');break}
case'fitness-edit':ui.fitnessEdit=structuredClone(db.fitness.find(x=>x.id===id));render();window.scrollTo(0,0);break;
case'fitness-cancel':ui.fitnessEdit=null;render();break;
case'fitness-delete':if(confirm('이 학생의 기록을 삭제할까요?')){db.fitness=db.fitness.filter(x=>x.id!==id);save();render()}break;
case'fitness-export':fitnessExport();toast('CSV 파일을 저장했어요.');break;
case'design-type':ui.design={type:id};render();break;
case'design-print':ui.design.title=attr('design-title').trim();ui.design.body=attr('design-body').trim();{const d=designDoc();printHTML(d.title,d.html)}break;
case'book-add':{const title=attr('book-title').trim();if(!title)return toast('책 제목을 입력해 주세요.');db.books.unshift({id:eid(),title,author:attr('book-author').trim(),date:attr('book-date'),review:attr('book-review').trim(),done:false});save();render();toast('책을 기록했어요. 완독 버튼을 누르면 섬이 열려요!');break}
case'book-filter':ui.booksFilter=id;render();break;
case'book-toggle':{const b=db.books.find(b=>b.id===id);if(b){b.done=!b.done;save();render();if(b.done)toast('완독 축하해요! 🎊')}break}
case'book-delete':db.books=db.books.filter(b=>b.id!==id);save();render();break;
case'book-print':printBooks();break;
case'settings-save':{const g=Number(attr('setting-grade')),r=Number(attr('setting-room'));if(!Number.isInteger(g)||g<1||g>6||!Number.isInteger(r)||r<1||r>30)return toast('학년(1~6)과 반(1~30)을 확인해 주세요.');db.settings={school:attr('setting-school').trim(),grade:g,room:r,teacher:attr('setting-teacher').trim()};save();render();toast('학급 설정을 저장했어요.');break}
case'settings-export':download(`우리반_교육플랫폼_백업_${dateToday()}.json`,JSON.stringify({app:'classroom-playground',version:1,data:db},null,2),'application/json;charset=utf-8');toast('백업 파일을 만들었어요.');break;
case'settings-clear':if(confirm('정말 모든 기록을 삭제할까요? 주간학습안내 PDF·이미지도 함께 삭제하며 되돌릴 수 없습니다.')){db=structuredClone(DEFAULT);save();ui.fitnessEdit=null;weeklyClearAll().catch(e=>console.warn('주간 자료 삭제 실패',e));for(const k of weeklyState.urls.keys())weeklyDestroyURL(k);weeklyState.entries.clear();render();toast('기록 초기화를 진행했어요.')}break;
default:console.warn('알 수 없는 버튼',name)
}}

document.addEventListener('click',e=>{const dest=e.target.closest('[data-view]');if(dest){e.preventDefault();navigate(dest.dataset.view);return}const btn=e.target.closest('[data-act]');if(btn){e.preventDefault();try{action(btn.dataset.act,btn.dataset.id??btn.dataset.answer??'')}catch(ex){console.error(ex);toast('작동 중 문제가 발생했어요. 화면을 새로고침해 주세요.')}}});
document.addEventListener('change',async e=>{const el=e.target;
if(el.id==='weekly-file'&&el.files?.[0]){await weeklyHandleFile(el.files[0]);return}
if(el.id==='weekly-date-picker'&&el.value){weeklyState.selectedWeek=weeklyWeek(new Date(el.value+'T12:00:00+09:00'));render();return}
if(el.dataset.change==='task-toggle'){const task=db.tasks.find(t=>t.id===el.dataset.id);if(task){task.done=el.checked;save();render()}}
if(el.id==='restore-file'&&el.files?.[0]){if(!confirm('현재 저장된 모든 기록을 백업 파일 내용으로 바꿀까요?')){el.value='';return}try{const loaded=JSON.parse(await el.files[0].text());if(loaded.app!=='classroom-playground'||!loaded.data||!Array.isArray(loaded.data.tasks)||!Array.isArray(loaded.data.books))throw Error('지원하지 않는 백업 형식');db={...structuredClone(DEFAULT),...loaded.data,settings:{...DEFAULT.settings,...loaded.data.settings},customReading:{...DEFAULT.customReading,...loaded.data.customReading}};save();ui.fitnessEdit=null;render();toast('백업 파일을 복원했어요.')}catch(err){console.error(err);toast('백업 파일 형식이 올바르지 않아요.') }}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#weekly-dropzone'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#weekly-dropzone')){e.preventDefault();weeklyHandleFile(e.dataTransfer?.files?.[0])}});
if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=()=>{ /* voices available as browser loads */ }}
personalImportFromHash();
render();
weeklyLoad().then(weeklyRefreshRemote);
setInterval(weeklyRefreshRemote,30*60*1000);

</script>
</body>
</html>
